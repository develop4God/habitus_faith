name: 🚀Flutter CI

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to test (leave empty for current)'
        required: false
        default: ''
      auto_format:
        description: 'Auto-format code if needed (manual runs only)'
        required: false
        default: true
        type: boolean

  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop", "copilot/**" ]

jobs:
  analyze:
    name: 📊 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref)
            || (github.event.inputs.target_branch != '' && format('refs/heads/{0}', github.event.inputs.target_branch)
            || github.ref) }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'   # pinned — update intentionally when upgrading SDK
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: "🔑 Create .env file from secret"
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        shell: bash

      - name: 🎨 Check formatting
        run: |
          echo "🎨 Checking Dart code formatting..."
          if ! dart format --set-exit-if-changed . 2>/dev/null; then
            echo "📝 Formatting issues detected!"
            if [ "${{ github.event_name }}" = "push" ] || \
               ([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.auto_format }}" = "true" ]); then
              echo "🔧 Auto-formatting enabled on push. Applying fixes..."
              dart format .
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action [bot]"

              if [ -n "${{ github.event.inputs.target_branch }}" ]; then
                BRANCH="${{ github.event.inputs.target_branch }}"
              else
                BRANCH="${{ github.ref_name }}"
              fi

              if ! git diff --quiet; then
                git add .
                git commit -m "🎨 Auto-format code with dart format [skip ci]"
                git push origin "$BRANCH"
              fi
            else
              echo "❌ Formatting errors — please run 'dart format .' locally before pushing."
              dart format --dry-run .
              exit 1
            fi
          else
            echo "✅ All files are properly formatted."
          fi

      - name: 🛠️ Check dart fix (dry-run — no auto-commit)
        run: |
          echo "🛠️ Checking for pending dart fixes..."
          dart fix --dry-run
          # Count pending fixes — fail if any exist so the author fixes locally
          PENDING=$(dart fix --dry-run 2>&1 | grep -c "^  " || true)
          if [ "$PENDING" -gt "0" ]; then
            echo "❌ $PENDING pending dart fix(es) found. Run 'dart fix --apply' locally and commit."
            exit 1
          else
            echo "✅ No pending dart fixes."
          fi

      - name: 🔍 Analyze code
        run: flutter analyze --fatal-infos

      - name: 📋 Check pub.dev score
        run: dart pub deps

  docs:
    name: 📚 Dartdoc (main only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: 📚 Validate Dartdoc links
        run: dart doc --validate-links

  test:
    name: 🧪 Testing
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'   # pinned — matches analyze job
          channel: stable
          cache: true                  # flutter-action handles pub cache — no manual cache step needed

      - name: 📦 Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: "🔑 Create .env file from secret"
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        shell: bash

      - name: 🧪 Run unit tests (expanded)
        run: |
          flutter test --coverage --reporter=expanded | tee test_output.txt

      - name: 📋 Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test_output.txt

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false

      - name: 📈 Generate coverage report
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info -o coverage/html
          lcov --summary coverage/lcov.info

      - name: 📋 Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  comment:
    name: 💬 PR Comment
    runs-on: ubuntu-latest
    needs: [analyze, test]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: 📥 Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
        continue-on-error: true

      - name: 💬 Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const analyzeStatus = '${{ needs.analyze.result }}';
            const testStatus = '${{ needs.test.result }}';
            const getStatusEmoji = (status) => {
              switch (status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                case 'skipped': return '⏭️';
                default: return '🔄';
              }
            };
            const comment = `## 🎉 CI Results for PR #${{ github.event.number }}

            ${getStatusEmoji(analyzeStatus)} **Static Analysis**: ${analyzeStatus}
            ${getStatusEmoji(testStatus)} **Tests**: ${testStatus}

            ### ${analyzeStatus === 'success' && testStatus === 'success' ? '🚀 Ready to merge!' : '⚠️ Issues found — check the logs'}

            ---
            *Generated by GitHub Actions • Flutter 3.38.5*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0   # pinned — do not use @master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'